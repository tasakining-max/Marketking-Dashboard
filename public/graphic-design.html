<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graphic Design — Marketing Dashboard</title>
<link rel="stylesheet" href="style.css" />
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
  <header>
    <h1>Graphic Design</h1>
    <nav class="top-nav">
      <a href="/index.html" class="nav-link">🎥 VDO</a>
      <a href="/auto-post.html" class="nav-link">🤖 Auto Post</a>
      <a href="/graphic-design.html" class="nav-link active">🎨 Graphic Design</a>
      <a href="/report.html" class="nav-link">📅 Reports</a>
      <a href="/ads.html" class="nav-link">📈 Ads</a>
      <a href="/insights.html" class="nav-link">📹 Insights</a>
      <a href="/website.html" class="nav-link">🌐 เว็บไซต์</a>
      <a href="/competitors.html" class="nav-link">🕵️ ส่องคู่แข่ง</a>
    </nav>
    <button id="addBtn" class="add-btn">+ New Design</button>
    <button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="Toggle dark/light theme" aria-label="Toggle dark/light theme">🌙</button>
  </header>

  <main id="board" class="graphic-board">
    <section class="column" data-column="todo">
      <h2>📝 ต้องทำ</h2>
      <div class="cards" data-column-cards="todo"></div>
    </section>
    <section class="column" data-column="in_progress">
      <h2>🎨 กำลังออกแบบ</h2>
      <div class="cards" data-column-cards="in_progress"></div>
    </section>
    <section class="column" data-column="done">
      <h2>✅ เสร็จแล้ว / ใช้งานแล้ว</h2>
      <div class="cards" data-column-cards="done"></div>
    </section>
  </main>

  <dialog id="cardDialog">
    <form id="cardForm">
      <div class="card-form-header">
        <h3 id="dialogTitle">New Design</h3>
      </div>
      <div class="card-form-body">
        <div class="card-form-left">
          <label>Title<input type="text" id="cardTitle" required maxlength="200" /></label>
          <label>Description / Notes<textarea id="cardDescription" rows="4"></textarea></label>
          <label>Image<input type="file" id="cardImageInput" accept="image/png,image/jpeg,image/webp,image/gif" /></label>
          <div id="cardImagePreviewWrap" class="card-image-preview-wrap" hidden>
            <img id="cardImagePreview" class="card-image-preview" alt="Preview" title="Click to view full size" draggable="false" />
            <button type="button" id="cardImageRemoveBtn" class="danger">Remove image</button>
          </div>
          <fieldset class="tag-fieldset">
            <legend>ใช้งานที่ไหน (เลือกได้มากกว่า 1)</legend>
            <label class="tag-checkbox"><input type="checkbox" name="cardUsage" value="website" /> 🌐 เว็บไซต์</label>
            <label class="tag-checkbox"><input type="checkbox" name="cardUsage" value="facebook_ads" /> 📘 Facebook Ads</label>
            <label class="tag-checkbox"><input type="checkbox" name="cardUsage" value="instagram_ads" /> 📸 Instagram Ads</label>
            <label class="tag-checkbox"><input type="checkbox" name="cardUsage" value="other" /> 📦 อื่นๆ</label>
          </fieldset>
        </div>
        <div id="cardCommentLabel" class="card-form-right" hidden>
          <div class="card-form-right-header">💬 Comments</div>
          <div id="cardCommentList" class="comment-list"></div>
          <div class="comment-add-row">
            <input type="text" id="cardCommentInput" placeholder="Add a comment…" maxlength="500" />
            <button type="button" id="cardCommentAddBtn">Post</button>
          </div>
        </div>
      </div>
      <p id="cardFormError" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="danger" hidden>Delete</button>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" id="cardSaveBtn"><span class="btn-spinner" hidden></span><span id="cardSaveBtnLabel">Save</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="lightboxDialog" class="lightbox-dialog">
    <img id="lightboxImage" alt="Full size preview" />
  </dialog>

  <script src="graphic-design.js"></script>
  <script src="tab-tracker.js"></script>
</body>
</html>
